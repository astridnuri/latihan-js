<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Latihan</title>
</head>

<body>
    <h1>Cek Tarif Kilat Bersama</h1>
    <script>
        let beratPaket = 10;
        const kotaTujuan = "Jakarta";
        let tarif = 0;
        if (kotaTujuan === "Bogor") {
            tarif = beratPaket * 2000;
            console.log("Tarifnya adalah sebesar Rp " + tarif);
        } else if (kotaTujuan === "Depok") {
            tarif = beratPaket * 4000;
            console.log("Tarifnya adalah sebesar Rp " + tarif);
        } else {
            tarif = beratPaket * 6000;
            console.log("Tarifnya adalah sebesar Rp " + tarif);
        }
    </script>
</body>

</html>
