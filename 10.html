<!-- event change: ada perubahan thd elemen. elemen a biasa a select-option sm input -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Event Change</title>
</head>

<body>
    <h2>Formulir Pendaftaran</h2>
    <label for="">Pilihan Jurusan</label>
    <select name="" id="jurusan">
        <option value="">Pilih Jurusan</option>
        <option value="Web Development">Junior Web Dev</option>
        <option value="Graphic Design">Desain Grafis</option>
        <option value="Network">Teknik Jaringan</option>
    </select>
    <br>
    <br>
    <label for="">
        <input type="checkbox" id="cekSyarat"> Saya menyetujui syarat dan ketentuan.
    </label>
    <button disabled id="btnDaftar">Daftar</button>
    <p id="hasil">Silakan pilih jurusan terlebih dahulu</p>

    <script>
        const jurusan = document.getElementById('jurusan')
        const hasil = document.getElementById('hasil')
        const cekSyarat = document.getElementById('cekSyarat')
        const btnDaftar = document.getElementById('btnDaftar')

        cekSyarat.addEventListener('change', function (e) {
            if ((e.target.checked) && (jurusan.value !== "")) {
                btnDaftar.disabled = false
            } else {
                btnDaftar.disabled = true
            }
        })

        jurusan.addEventListener('change', function (e) {
            const jurusanTerpilih = e.target.value
            if (jurusanTerpilih === "") {
                hasil.innerText = "Silakan pilih jurusan terlebih dahulu"
            } else {
                hasil.innerText = `Kamu sudah memilih jurusan ${jurusanTerpilih}`
            }
        }
        )


    </script>

</body>

</html>
